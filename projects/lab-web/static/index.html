<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Learning Lab</title>
  <meta name="description" content="Notes, experiments and small working demos from my study of machine learning." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap bar-row">
      <a class="brand" href="#top">AI Learning Lab</a>
      <nav class="nav" aria-label="Sections">
        <a href="#waste" data-i18n="nav.waste"></a>
        <a href="#seg" data-i18n="nav.seg"></a>
        <a href="#sent" data-i18n="nav.sent"></a>
        <a href="#fc" data-i18n="nav.fc"></a>
        <a href="#journey" data-i18n="nav.journey"></a>
      </nav>
      <div class="controls">
        <div class="lang" id="lang" role="group" aria-label="Language">
          <button type="button" data-lang="en">EN</button><span aria-hidden="true">/</span><button type="button" data-lang="vi">VI</button>
        </div>
        <button type="button" id="theme" class="theme" aria-label="Toggle theme" data-i18n-title="theme.title"></button>
        <a class="gh" id="repo-link" href="https://github.com/tranvanhuy-hichan/ai-learning-lab" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </header>

  <main class="wrap" id="top">
    <section class="intro">
      <p class="kicker" data-i18n="hero.badge"></p>
      <h1 data-i18n="hero.title"></h1>
      <p class="lead" data-i18n="hero.lead"></p>

      <table class="results" aria-describedby="results-cap">
        <thead>
          <tr><th data-i18n="tbl.task"></th><th data-i18n="tbl.model"></th><th data-i18n="tbl.result"></th><th data-i18n="tbl.note"></th></tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
      <p class="caption" id="results-cap" data-i18n="tbl.cap"></p>
    </section>

    <!-- ============ 1. WASTE ============ -->
    <section class="tool" id="waste">
      <h2><span class="num">1</span><span data-i18n="waste.title"></span></h2>
      <p class="lead" data-i18n="waste.desc"></p>
      <h3 data-i18n="learned"></h3>
      <ul class="learned"><li data-i18n="waste.l1"></li><li data-i18n="waste.l2"></li><li data-i18n="waste.l3"></li></ul>
      <p class="facts" id="facts-waste"></p>

      <div class="demo">
        <label class="drop" id="waste-drop" tabindex="0">
          <input type="file" accept="image/*" id="waste-file" hidden />
          <img id="waste-preview" alt="" hidden />
          <div class="drop-hint"><b data-i18n="drop.title"></b><span data-i18n="drop.sub"></span></div>
        </label>
        <div class="msg" id="waste-msg" hidden></div>
        <div id="waste-out" class="out" hidden>
          <p class="verdict"><span class="k" data-i18n="waste.pred"></span> <strong id="waste-label"></strong> <span class="pct" id="waste-pct"></span></p>
          <div class="bars" id="waste-bars"></div>
          <p class="tip"><span class="k" data-i18n="waste.tip"></span> <span id="waste-tip"></span></p>
        </div>
      </div>
      <p class="caption" data-i18n="waste.note"></p>
    </section>

    <!-- ============ 2. SEGMENTATION ============ -->
    <section class="tool" id="seg">
      <h2><span class="num">2</span><span data-i18n="seg.title"></span></h2>
      <p class="lead" data-i18n="seg.desc"></p>
      <h3 data-i18n="learned"></h3>
      <ul class="learned"><li data-i18n="seg.l1"></li><li data-i18n="seg.l2"></li><li data-i18n="seg.l3"></li></ul>
      <p class="facts" id="facts-seg"></p>

      <div class="demo">
        <div class="row">
          <span class="k" data-i18n="seg.model"></span>
          <div class="seg" id="seg-models" role="group"></div>
        </div>
        <label class="drop slim" id="seg-drop" tabindex="0">
          <input type="file" accept="image/*" id="seg-file" hidden />
          <div class="drop-hint"><b data-i18n="drop.title"></b><span data-i18n="drop.sub"></span></div>
        </label>
        <div class="examples"><span class="k" data-i18n="seg.examples"></span><div id="seg-examples" class="thumbs"></div></div>
        <div class="msg" id="seg-msg" hidden></div>
        <div id="seg-out" class="out" hidden>
          <div class="canvas-wrap"><canvas id="seg-canvas"></canvas></div>
          <div class="row between">
            <label class="slider"><span class="k" data-i18n="seg.opacity"></span><input type="range" id="seg-opacity" min="0" max="100" value="55" /></label>
            <div class="legend" id="seg-legend"></div>
          </div>
          <div class="bars" id="seg-bars"></div>
        </div>
      </div>
      <p class="caption" data-i18n="seg.note"></p>
    </section>

    <!-- ============ 3. SENTIMENT ============ -->
    <section class="tool" id="sent">
      <h2><span class="num">3</span><span data-i18n="sent.title"></span></h2>
      <p class="lead" data-i18n="sent.desc"></p>
      <h3 data-i18n="learned"></h3>
      <ul class="learned"><li data-i18n="sent.l1"></li><li data-i18n="sent.l2"></li><li data-i18n="sent.l3"></li></ul>
      <p class="facts" id="facts-sent"></p>

      <div class="demo">
        <p class="warn" data-i18n="sent.lang"></p>
        <textarea id="sent-text" rows="4" maxlength="5000" data-i18n-ph="sent.ph"></textarea>
        <div class="examples"><span class="k" data-i18n="sent.examples"></span><div id="sent-examples" class="pills"></div></div>
        <div class="row"><button type="button" class="btn" id="sent-go" data-i18n="sent.go"></button><span class="count" id="sent-count"></span></div>
        <div class="msg" id="sent-msg" hidden></div>
        <div id="sent-out" class="cards2" hidden></div>
      </div>
    </section>

    <!-- ============ 4. FORECAST ============ -->
    <section class="tool" id="fc">
      <h2><span class="num">4</span><span data-i18n="fc.title"></span></h2>
      <p class="lead" data-i18n="fc.desc"></p>
      <h3 data-i18n="learned"></h3>
      <ul class="learned"><li data-i18n="fc.l1"></li><li data-i18n="fc.l2"></li><li data-i18n="fc.l3"></li></ul>
      <p class="facts" id="facts-fc"></p>

      <div class="demo">
        <div class="field"><span class="k" data-i18n="fc.pick"></span><div class="pills" id="fc-samples"></div></div>
        <div class="msg" id="fc-msg" hidden></div>
        <div class="chart-wrap"><svg id="fc-chart" viewBox="0 0 680 270" role="img" aria-label="Temperature chart"></svg></div>
        <div class="legend" id="fc-legend"></div>
        <div id="fc-table" class="table"></div>
        <details class="custom">
          <summary data-i18n="fc.custom"></summary>
          <textarea id="fc-custom" rows="3" data-i18n-ph="fc.custom.ph"></textarea>
          <button type="button" class="btn ghost" id="fc-custom-go" data-i18n="fc.custom.go"></button>
        </details>
      </div>
      <p class="caption" data-i18n="fc.note"></p>
    </section>

    <!-- ============ JOURNEY ============ -->
    <section class="tool journey" id="journey">
      <h2 data-i18n="journey.title"></h2>
      <p class="lead" data-i18n="journey.lead"></p>
      <ol class="steps">
        <li><b data-i18n="journey.s1.t"></b> <span data-i18n="journey.s1.d"></span></li>
        <li><b data-i18n="journey.s2.t"></b> <span data-i18n="journey.s2.d"></span></li>
        <li><b data-i18n="journey.s3.t"></b> <span data-i18n="journey.s3.d"></span></li>
      </ol>
      <p class="links">
        <a data-repo="/blob/main/learning/ROADMAP.md" target="_blank" rel="noopener" data-i18n="journey.roadmap"></a>
        <a data-repo="/tree/main/learning/log" target="_blank" rel="noopener" data-i18n="journey.log"></a>
        <a data-repo="/tree/main/learning/notes" target="_blank" rel="noopener" data-i18n="journey.notes"></a>
      </p>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap">
      <p data-i18n="foot.1"></p>
      <p data-i18n="foot.2"></p>
    </div>
  </footer>

  <script src="/app.js" defer></script>
</body>
</html>
