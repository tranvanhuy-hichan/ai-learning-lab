# Repo-wide tooling config. Each project keeps its own dependencies and tests under projects/<name>/.
[tool.ruff]
line-length = 120
target-version = "py310"
src = ["projects/vision-toolkit/src", "projects/vision-toolkit", "projects/sequence-modeling"]
extend-exclude = ["**/training", "*.ipynb"]  # research notebooks and their helper modules

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"projects/vision-toolkit/app.py" = ["E402"]
"projects/vision-toolkit/scripts/*" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]
